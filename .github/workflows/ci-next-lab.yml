name: CI - Next Lab

on:
  push:
    branches: [main, develop]
    paths:
      - 'apps/next-lab/**'
      - 'packages/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'turbo.json'
      - 'eslint.config.js'

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.24.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint next-lab
        run: pnpm --filter next-lab lint

      - name: Type check next-lab
        run: pnpm --filter next-lab exec tsc --noEmit

      - name: Run next-lab unit and component tests
        run: pnpm --filter next-lab test

      - name: Build next-lab
        run: pnpm --filter next-lab build

      - name: Install Playwright Chromium
        run: pnpm --filter next-lab exec playwright install --with-deps chromium

      - name: Run next-lab end-to-end tests
        run: pnpm --filter next-lab test:e2e
